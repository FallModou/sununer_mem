
services:

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sununer-api
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /api/model
    restart: unless-stopped
    networks:
      - sununer-network

  interface:
    build:
      context: ./interface
      dockerfile: Dockerfile
    container_name: sununer-interface
    ports:
      - "8501:8501"
    environment:
      SUNUNER_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sununer-network

networks:
  sununer-network:
    driver: bridge
